[General]
bEnabled=1

[Log]
; Log goes to Documents/My Games/Fallout4/F4SE/fo4idlefix.log
; One line per idle turn of a standing NPC (how far, did it come back, where the player was, anim events).
bLogEpisodes=1
; For every turn-and-return, dump the full timeline: heading, position, frame time,
; the graph variables below and every animation event, from 0.5s before the turn.
bDumpEpisodes=1
; Stop dumping timelines after this many (summary lines keep going).
iMaxDumps=40
; Log every animation event of tracked NPCs as it happens (very spammy).
bLogAllEvents=0
; Only NPCs this close to the player are watched (game units, ~70 units = 1 m).
fRadius=1500
; Heading changes smaller than this (degrees) are ignored.
fMinTurnDeg=4
; Seconds between stats lines (fps, how many turns so far). 0 = off.
fStatsInterval=60
; Behaviour graph variables to sample (comma separated). Ones the graph doesn't have are skipped;
; the log lists which ones each NPC really has.
sGraphVars=Speed,Direction,TurnDelta,TurnDeltaDamped,SpeedSmoothed,IsTurning,bIsTurning,fTurnAngle,TurnAngle,iSyncTurnState,bAllowRotation,bAnimationDriven,bHeadTrackingOn,IsMoving

[Fix]
; Experimental, leave off until the log shows which variable drives the turn.
; Zeroes sTurnVar on standing NPCs whenever it's non-zero but below fZeroBelow,
; so small turn requests never start the turn-in-place animation.
bZeroTurnVar=0
sTurnVar=TurnDelta
; In the variable's own units (TurnDelta is radians: 0.5 = ~29 degrees).
fZeroBelow=0.5
